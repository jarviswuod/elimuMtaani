# One command for the whole stack:  docker compose -f docker/docker-compose.yml up
#
# Build context is the repo ROOT (..) because this is an npm workspaces monorepo —
# the backend and frontend images both need shared/ to build.

name: elimu

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elimu
      POSTGRES_PASSWORD: elimu
      POSTGRES_DB: elimu
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elimu -d elimu']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      NODE_ENV: development
      PORT: '4000'
      DATABASE_URL: postgres://elimu:elimu@db:5432/elimu
      CORS_ORIGIN: http://localhost:5173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ELIMU_MODEL: ${ELIMU_MODEL:-claude-opus-5}
      ELIMU_USE_FIXTURES: ${ELIMU_USE_FIXTURES:-false}
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Live reload during the hackathon — edit on the host, tsx restarts inside.
      - ../backend/src:/app/backend/src:ro
      - ../shared/src:/app/shared/src:ro
      - ../data:/app/data:ro

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - ../frontend/src:/app/frontend/src:ro
      - ../shared/src:/app/shared/src:ro

volumes:
  db-data:
